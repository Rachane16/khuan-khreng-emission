name: Collect FIRMS and deploy dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'config/**', 'requirements.txt', 'tests/**', '.github/workflows/dashboard.yml']
concurrency:
  group: firms-dashboard
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fire_pipeline.py bootstrap
      - name: Collect live FIRMS data
        id: collect
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -n "$FIRMS_MAP_KEY" ]; then
            python scripts/fire_pipeline.py collect --days 3
          else
            echo "::warning::FIRMS_MAP_KEY is not configured. Publishing saved data."
          fi
      - name: Preserve daily history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m "Update FIRMS daily observations and emission estimates"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
